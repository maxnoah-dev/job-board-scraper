# Ruff configuration for job-board-scraper.
target-version = "py311"

[lint]
select = ["E", "W", "F", "B", "UP", "S", "I", "C4", "N", "SIM", "TID"]
ignore = [
    "E501",
    "B008",
]

[lint.per-file-ignores]
"tests/**/*.py" = ["S101", "N801"]
"src/job_board_scraper/__init__.py" = ["F401"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[isort]
known-first-party = ["job_board_scraper"]