# Ruff configuration for job-board-scraper.
# See https://docs.astral.sh/ruff/settings/ for full documentation.

target-version = "py311"

# Exclude paths that are out of the project's scope:
#   .venv/        — Python virtualenv
#   .claude/      — Cursor/Claude config (not project code)
#   .cursor/      — Cursor IDE config
#   .vendor/      — pip --target install cache
#   agent-transcripts/ — conversation logs
#   data/         — generated SQLite + CSV exports
#   docs/         — documentation (Markdown; no lint needed)
extend-exclude = [
    ".venv",
    ".claude",
    ".cursor",
    ".vendor",
    "agent-transcripts",
    "data",
    "docs",
    "logs",
    "build",
    "dist",
]

[lint]
# Rule sets:
#   E/W   — pycodestyle (PEP 8 errors + warnings)
#   F     — pyflakes (unused imports, undefined names)
#   B     — flake8-bugbear (likely bugs)
#   UP    — pyupgrade (modern Python idioms)
#   S     — flake8-bandit (security issues)
#   I     — isort (import order)
#   C4    — flake8-comprehensions (better comprehensions)
#   N     — pep8-naming (PEP 8 naming conventions)
#   SIM   — flake8-simplify (simplification opportunities)
#   TID   — flake8-tidy-imports (clean imports)
select = ["E", "W", "F", "B", "UP", "S", "I", "C4", "N", "SIM", "TID"]
ignore = [
    "E501",  # line length (enforced by formatter)
    "B008",  # function call in default argument (acceptable for settings singletons)
    "UP042",  # StrEnum only in Python 3.11+ (acceptable for this project)
    "SIM102",  # nested if statements are clearer in some cases
    "SIM103",  # explicit boolean return is clearer
    "SIM108",  # ternary operator not always clearer
    "SIM201",  # != is not always clearer than not ==
    "C401",  # generator is fine for this use case
    "S311",  # random.uniform is fine for rate limiting
]

[lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # asserts are the whole point of tests
    "N801",  # PascalCase class names not required for pytest Test classes
    "S603",  # subprocess calls in tests are intentional (forking pytest/CLI tools)
    "E741",  # single-letter `l` is fine inside test fixtures
    "E402",  # imports after sys.path modification
    "E712",  # equality to True is sometimes clearer in tests
    "B007",  # unused loop variable acceptable in tests
    "B017",  # bare Exception in tests is acceptable
    "SIM105",  # try/except/pass sometimes clearer in tests
    "F841",  # unused variables acceptable in tests
    "S108",  # temp file usage acceptable in tests
]
"tests/integration/**/*.py" = [
    "E402",  # sys.path modification required for test imports
]
"src/job_board_scraper/__init__.py" = ["F401"]  # re-exports allowed
"src/job_board_scraper/web/app.py" = [
    "S104",  # binding to 0.0.0.0 is intentional for dev server
]
"src/job_board_scraper/repositories/company_repository.py" = [
    "E712",  # Company.is_active == True is clearer than Company.is_active
]
"src/job_board_scraper/web/routes/api.py" = [
    "E712",  # Company.is_active == True is clearer than Company.is_active
]
"migrations/**/*.py" = [
    "E402",  # imports must be after sys.path modification
    "F401",  # imports used for Alembic metadata
    "I001",  # import order doesn't matter for migrations
    "UP007",  # Union[X, Y] is required by Alembic
    "UP035",  # typing.Sequence is required by Alembic
]

[lint.isort]
known-first-party = ["job_board_scraper"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
