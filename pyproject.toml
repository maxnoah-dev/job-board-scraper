[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "job-board-scraper"
version = "0.1.0"
description = "Async ETL pipeline that scrapes job listings from 11+ company career pages."
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11,<3.13"
authors = [
    {name = "Engineering Lead", email = "engineering@example.com"},
]
keywords = ["scraper", "etl", "jobs", "careers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
# Runtime dependencies
dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "python-dotenv>=1.0,<2",
    "structlog>=24.1,<25",
    # Phase 2: Database
    "sqlalchemy>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "httpx>=0.27,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "jinja2>=3.1,<4",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<7",
]

[project.urls]
Repository = "https://github.com/maxnoah-dev/job-board-scraper"
Documentation = "https://github.com/maxnoah-dev/job-board-scraper/tree/main/docs"

[project.optional-dependencies]
# Legacy PEP 621 optional deps kept so `pip install .[dev]` still works
# for environments where Poetry is not available.
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=5,<8",
    "ruff>=0.5,<1",
    "pyright>=1.1,<2",
    "mypy>=1.10,<2",
    "detect-secrets>=1.5,<2",
    "pyyaml>=6,<7",
    "sqlalchemy>=2.0,<3",
]

[tool.poetry]
name = "job-board-scraper"
version = "0.1.0"
description = "Async ETL pipeline that scrapes job listings from 11+ company career pages."
readme = "README.md"
package-mode = true
authors = ["Engineering Lead <engineering@example.com>"]
license = "Proprietary"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pydantic = "^2.6"
pydantic-settings = "^2.2"
python-dotenv = "^1.0"
structlog = "^24.1"
sqlalchemy = "^2.0"
aiosqlite = "^0.20"
asyncpg = "^0.29"
alembic = "^1.13"
httpx = "^0.27"
# Web dashboard
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
jinja2 = "^3.1"
# HTML parsing
beautifulsoup4 = "^4.12"
lxml = "^5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
ruff = "^0.5"
pyright = "^1.1"
mypy = "^1.10"
detect-secrets = "^1.5"
pyyaml = "^6.0"
alembic = "^1.13"

[tool.poetry.scripts]
job-board-scraper = "job_board_scraper.cli:main"
init-db = "job_board_scraper.cli:main"
seed-companies = "job_board_scraper.cli:main"
run-scrape = "job_board_scraper.cli:main"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: pure unit tests (no external services).",
    "integration: tests touching the database, the file system, or a mock HTTP server.",
    "e2e: process-level end-to-end tests.",
    "slow: tests that take more than 1s; excluded from default runs.",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["job_board_scraper"]
omit = [
    "job_board_scraper/__main__.py",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
# 80% global floor per the ROADMAP Phase 1 gate (P1-04).
fail_under = 80
fail_under_check = "global"
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.coverage.paths]
source = ["src", "*/site-packages/job_board_scraper"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
exclude = [
    ".venv",
    "data",
    "logs",
]

[tool.detect-secrets]
# `.secrets.baseline` is generated by `detect-secrets scan` and committed
# to the repo. New secrets must be reviewed before being accepted into
# the baseline.
exclude_lines = [
    "(?i)<api[_-]?key[^>]*>[^<]+</api[_-]?key>",
    "(?i)<password[^>]*>[^<]+</password>",
]
